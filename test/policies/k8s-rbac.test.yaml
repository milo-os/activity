    exp_summary: "alice@example.com changed cluster-wide access view-logs-oncall"

  - name: "rbac-clusterrolebindings: create by a controller renders System"
    audit: {verb: create, user: {username: "system:serviceaccount:kube-system:generic-controller"}, objectRef: {apiGroup: "rbac.authorization.k8s.io", resource: clusterrolebindings, name: view-logs-oncall}}
