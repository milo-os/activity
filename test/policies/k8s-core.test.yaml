# Unit tests for the example ActivityPolicies in examples/basic-kubernetes.
# Every rule is covered; run with `task test:policies`.
policy_files:
  - ../../examples/basic-kubernetes

tests:
  - name: "core-pods: create by a user"
    audit: {verb: create, user: {username: "alice@example.com"}, objectRef: {apiGroup: "", resource: pods, namespace: default, name: debug-pod}}
    exp_policy: core-pods
    exp_rule: create
    exp_summary: "alice@example.com started debug-pod"
    exp_change_source: human
    exp_actor: {type: user, name: alice@example.com, email: alice@example.com}
    exp_links: [{marker: "alice@example.com", kind: user, name: "alice@example.com"}, {marker: debug-pod, apiGroup: "", kind: Pod, name: debug-pod, namespace: default}]

  - name: "core-pods: delete by a user"
    audit: {verb: delete, user: {username: "alice@example.com"}, objectRef: {apiGroup: "", resource: pods, namespace: default, name: debug-pod}}
    exp_policy: core-pods
    exp_rule: delete
    exp_summary: "alice@example.com stopped debug-pod"
    exp_change_source: human

  - name: "core-pods: update by a user"
    audit: {verb: update, user: {username: "alice@example.com"}, objectRef: {apiGroup: "", resource: pods, namespace: default, name: debug-pod}}
    exp_policy: core-pods
    exp_rule: update
    exp_summary: "alice@example.com updated debug-pod"
    exp_change_source: human

  - name: "core-pods: patch matches the update rule"
    audit: {verb: patch, user: {username: "alice@example.com"}, objectRef: {apiGroup: "", resource: pods, namespace: default, name: debug-pod}}
    exp_rule: update
    exp_summary: "alice@example.com updated debug-pod"

  - name: "core-pods: create by a controller renders System"
    audit: {verb: create, user: {username: "system:serviceaccount:kube-system:generic-controller"}, objectRef: {apiGroup: "", resource: pods, namespace: default, name: debug-pod}}
    exp_rule: create
    exp_summary: "System started debug-pod"
    exp_change_source: system
    exp_links: [{marker: debug-pod, apiGroup: "", kind: Pod, name: debug-pod, namespace: default}]

  - name: "core-pods: create without a name uses the fallback"
    audit: {verb: create, user: {username: "alice@example.com"}, objectRef: {apiGroup: "", resource: pods, namespace: default}}
    exp_rule: create
    exp_summary: "alice@example.com started pod"

  - name: "core-pods: get is not an activity"
    policy: core-pods
    audit: {verb: get, user: {username: "alice@example.com"}, objectRef: {apiGroup: "", resource: pods, namespace: default, name: debug-pod}}
    exp_no_match: true

  - name: "core-pods: eviction by a user matches evict before create"
    audit: {verb: create, user: {username: "alice@example.com"}, objectRef: {apiGroup: "", resource: pods, namespace: default, name: debug-pod, subresource: eviction}}
    exp_rule: evict
    exp_summary: "alice@example.com evicted debug-pod"
    exp_change_source: human

  - name: "core-pods: eviction by the node controller"
    audit: {verb: create, user: {username: "system:serviceaccount:kube-system:node-controller"}, objectRef: {apiGroup: "", resource: pods, namespace: default, name: debug-pod, subresource: eviction}}
    exp_rule: evict
    exp_summary: "System evicted debug-pod"
    exp_change_source: system

  - name: "core-pods: kubelet status patch matches update"
    audit: {verb: patch, user: {username: "system:node:worker-1"}, objectRef: {apiGroup: "", resource: pods, namespace: default, name: debug-pod, subresource: status}}
    exp_rule: update
    exp_summary: "System updated debug-pod"
    exp_change_source: system

