apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: activity-system

configMapGenerator:
  - name: audit-pipeline-dashboard
    files:
      - generated/audit-pipeline.json
    options:
      labels:
        grafana_dashboard: "1"
      disableNameSuffixHash: true

  - name: activity-apiserver-dashboard
    files:
      - generated/activity-apiserver.json
    options:
      labels:
        grafana_dashboard: "1"
      disableNameSuffixHash: true

  - name: activity-processor-dashboard
    files:
      - generated/activity-processor.json
    options:
      labels:
        grafana_dashboard: "1"
      disableNameSuffixHash: true

  - name: events-pipeline-dashboard
    files:
      - generated/events-pipeline.json
    options:
      labels:
        grafana_dashboard: "1"
      disableNameSuffixHash: true

  - name: activity-system-overview-dashboard
    files:
      - generated/activity-system-overview.json
    options:
      labels:
        grafana_dashboard: "1"
      disableNameSuffixHash: true

  - name: activity-slo-dashboard
    files:
      - generated/activity-slo.json
    options:
      labels:
        grafana_dashboard: "1"
      disableNameSuffixHash: true

  - name: activity-dlq-policy-health-dashboard
    files:
      - generated/activity-dlq-policy-health.json
    options:
      labels:
        grafana_dashboard: "1"
      disableNameSuffixHash: true

resources:
  - audit-pipeline-grafanadashboard.yaml
  - activity-apiserver-grafanadashboard.yaml
  - activity-processor-grafanadashboard.yaml
  - events-pipeline-grafanadashboard.yaml
  - activity-system-overview-grafanadashboard.yaml
  - activity-slo-grafanadashboard.yaml
  - activity-dlq-policy-health-grafanadashboard.yaml
