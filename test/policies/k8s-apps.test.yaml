# Unit tests for the example ActivityPolicies in examples/basic-kubernetes.
# Every rule is covered; run with `task test:policies`.
policy_files:
  - ../../examples/basic-kubernetes

tests:
  - name: "apps-deployments: create by a user"
    audit: {verb: create, user: {username: "alice@example.com"}, objectRef: {apiGroup: "apps", resource: deployments, namespace: default, name: web-frontend}}
    exp_policy: apps-deployments
    exp_rule: create
    exp_summary: "alice@example.com deployed web-frontend"
    exp_change_source: human
    exp_actor: {type: user, name: alice@example.com, email: alice@example.com}
    exp_links: [{marker: "alice@example.com", kind: user, name: "alice@example.com"}, {marker: web-frontend, apiGroup: "apps", kind: Deployment, name: web-frontend, namespace: default}]

  - name: "apps-deployments: delete by a user"
    audit: {verb: delete, user: {username: "alice@example.com"}, objectRef: {apiGroup: "apps", resource: deployments, namespace: default, name: web-frontend}}
    exp_policy: apps-deployments
    exp_rule: delete
    exp_summary: "alice@example.com removed web-frontend"
    exp_change_source: human

  - name: "apps-deployments: update by a user"
    audit: {verb: update, user: {username: "alice@example.com"}, objectRef: {apiGroup: "apps", resource: deployments, namespace: default, name: web-frontend}}
    exp_policy: apps-deployments
    exp_rule: update
    exp_summary: "alice@example.com updated web-frontend"
    exp_change_source: human

  - name: "apps-deployments: patch matches the update rule"
    audit: {verb: patch, user: {username: "alice@example.com"}, objectRef: {apiGroup: "apps", resource: deployments, namespace: default, name: web-frontend}}
    exp_rule: update
    exp_summary: "alice@example.com updated web-frontend"

  - name: "apps-deployments: create by a controller renders System"
    audit: {verb: create, user: {username: "system:serviceaccount:kube-system:generic-controller"}, objectRef: {apiGroup: "apps", resource: deployments, namespace: default, name: web-frontend}}
    exp_rule: create
    exp_summary: "System deployed web-frontend"
    exp_change_source: system
    exp_links: [{marker: web-frontend, apiGroup: "apps", kind: Deployment, name: web-frontend, namespace: default}]

  - name: "apps-deployments: create without a name uses the fallback"
    audit: {verb: create, user: {username: "alice@example.com"}, objectRef: {apiGroup: "apps", resource: deployments, namespace: default}}
    exp_rule: create
    exp_summary: "alice@example.com deployed application"

  - name: "apps-deployments: get is not an activity"
    policy: apps-deployments
    audit: {verb: get, user: {username: "alice@example.com"}, objectRef: {apiGroup: "apps", resource: deployments, namespace: default, name: web-frontend}}
    exp_no_match: true

  - name: "apps-deployments: patch on the scale subresource matches scale before update"
    audit: {verb: patch, user: {username: "alice@example.com"}, objectRef: {apiGroup: "apps", resource: deployments, namespace: default, name: web-frontend, subresource: scale}}
    exp_rule: scale
    exp_summary: "alice@example.com scaled web-frontend"

  - name: "apps-deployments: update on the scale subresource matches scale before update"
    audit: {verb: update, user: {username: "alice@example.com"}, objectRef: {apiGroup: "apps", resource: deployments, namespace: default, name: web-frontend, subresource: scale}}
    exp_rule: scale
    exp_summary: "alice@example.com scaled web-frontend"

  - name: "apps-deployments: scale without a name uses the scale fallback"
    audit: {verb: patch, user: {username: "alice@example.com"}, objectRef: {apiGroup: "apps", resource: deployments, namespace: default, subresource: scale}}
    exp_rule: scale
    exp_summary: "alice@example.com scaled application"

  - name: "apps-replicasets: create by a user"
    audit: {verb: create, user: {username: "alice@example.com"}, objectRef: {apiGroup: "apps", resource: replicasets, namespace: default, name: web-frontend-7d9c}}
