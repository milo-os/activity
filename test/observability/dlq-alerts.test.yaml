  - name: new ownership replaces older replica metadata
    interval: 1m
    input_series:
    - series: activity_processor_policy_info{cluster="production",namespace="activity-system",policy_name="httpproxy",pod="old",policy_service="old-service",policy_team="sre"}
      values: 1+0x10
    - series: activity_processor_policy_info{cluster="production",namespace="activity-system",policy_name="httpproxy",pod="new",policy_service="network-services",policy_team="delivery"}
      values: _ _ _ _ _ _ _ _ _ _ _ 1+0x20
    promql_expr_test:
    - expr: activity_processor:policy_owner:info
      eval_time: 12m
      exp_samples:
      - labels: activity_processor:policy_owner:info{cluster="production",namespace="activity-system",policy_name="httpproxy",policy_service="network-services",policy_team="delivery"}
        value: 1
