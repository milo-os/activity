    interval: 1m
    input_series:
      - series: activity_processor_dlq_retry_failed_total{cluster="production",namespace="activity-system",policy_name="networking.datumapis.com-httpproxy",api_group="networking.datumapis.com",kind="HTTPProxy",error_type="cel_summary",pod="processor-a"}
        values: 0 3+0x90
    alert_rule_test:
      - eval_time: 30m
        alertname: ActivityPolicyRetriesFailing
