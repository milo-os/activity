        values: 0+1x122
    alert_rule_test:
      - eval_time: 40m
        alertname: ActivityPolicyRetriesFailing
        exp_alerts: []
      - eval_time: 100m
        alertname: ActivityPolicyRetriesFailing
        exp_alerts: []
