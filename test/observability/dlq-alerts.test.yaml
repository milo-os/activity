      eval_time: 130m
      exp_samples:
      - labels: '{alertname="ActivityPolicyFailuresHigh",service="network-services",team="delivery"}'
        value: 1
      - labels: '{alertname="ActivityPolicyHighRetryCount",service="network-services",team="delivery"}'
        value: 1
      - labels: '{alertname="ActivityPolicyFailuresRecurring",service="network-services",team="delivery"}'
        value: 1
      - labels: '{alertname="ActivityPolicyRetriesFailing",service="network-services",team="delivery"}'
        value: 1
      - labels: '{alertname="ActivityPolicyEventProcessingErrors",service="network-services",team="delivery"}'
        value: 1
