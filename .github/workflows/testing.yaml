name: "Execute Golang Tests"
on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (startsWith(github.ref, 'refs/heads/') && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)) }}

jobs:
  execute-tests:
    runs-on: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && vars.MILO_LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install dependencies
        run: go mod download
      - name: Execute golang tests
        run: go test -timeout 5m ./...
      - name: Validate and test example ActivityPolicies
        run: go run ./cmd/activitytool test --fail-on-untested --fail-on-untested-rules --policies examples/basic-kubernetes test/policies
  activitytool-image:
    name: Policy tests in the activitytool image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Build the activitytool image
        run: docker build -f cmd/activitytool/Dockerfile -t activitytool:ci .
      - name: Run the example policy tests the way other repos do
        run: |
          docker run --rm --network none --user 65532:65532 --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --volume "$PWD:/work:ro" --workdir /work \
            activitytool:ci \
            test --fail-on-untested --fail-on-untested-rules --policies examples/basic-kubernetes test/policies
  ui-tests:
    name: UI lint, typecheck, build, e2e
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run type-check
      - run: pnpm run build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e
