# Deliberately unbound. Do not add a Role, ClusterRole or binding for this
# account. activity-mcp reads as the caller, using the bearer token the
# assistant forwards on each request, so the asker's own RBAC is the single
# enforcement point. Granting this account read access to activities or audit
# logs would give every tenant's data to anyone who can steer a prompt.
#
# The token is not mounted: the Milo address and CA come from the kubeconfig
# the deployer supplies, and the server never uses its own identity.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: activity-mcp
  namespace: activity-system
  labels:
    app.kubernetes.io/name: activity-mcp
    app.kubernetes.io/instance: activity-mcp
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/part-of: activity.miloapis.com
automountServiceAccountToken: false
