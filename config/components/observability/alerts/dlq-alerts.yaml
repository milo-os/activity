apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: dlq-alerts
  namespace: activity-system
  labels:
    prometheus: activity
    app.kubernetes.io/part-of: activity
    monitoring: "true"
spec:
  groups:
    # =========================================================================
    # DLQ Health Alerts - SRE Ownership
    # =========================================================================
    - name: dlq-health
      interval: 30s
      rules:
        # DLQ Growing - Queue Not Draining
        - alert: ActivityPolicyFailuresHigh
          expr: |
            rate(activity_processor_dlq_events_published_total[5m]) > 0.1
            AND
            increase(activity_processor_dlq_events_published_total[15m]) > 100
          for: 15m
          labels:
            severity: warning
            component: activity-processor
            team: sre
          annotations:
            summary: "Activity policy{{ if $labels.policy_name }} {{ $labels.policy_name }}{{ end }} is failing to generate activities"
            description: "Activity processing{{ if $labels.cluster }} on {{ $labels.cluster }}{{ end }} is sending {{ $value }} {{ $labels.event_type }} events/sec for {{ $labels.api_group }}/{{ $labels.kind }} to the dead-letter queue after {{ $labels.error_type }} failures. This rate has persisted for 15 minutes. Check the activity policy and processor logs for the failing rule and event payload."
            impact: "Affected events are not producing activity entries; timelines may be incomplete until the failures are resolved and events recover."
            runbook_url: "https://github.com/milo-os/activity/blob/main/docs/runbooks/dlq/dlq-growth.md"

        # DLQ Publish Errors
        - alert: ActivityPolicyFailedEventsNotRetained
          expr: rate(activity_processor_dlq_publish_errors_total[5m]) > 0.1
          for: 10m
          labels:
            severity: warning
            component: activity-processor
            team: sre
          annotations:
            summary: "Events that failed activity processing cannot be saved for retry"
            description: "The activity processor{{ if $labels.cluster }} on {{ $labels.cluster }}{{ end }} reports {{ $value }} errors/sec while saving failed {{ $labels.event_type }} events to the dead-letter queue (phase: {{ $labels.error_phase }}). Check processor logs and queue connectivity so events that failed activity policy processing can be retained for retry."
            impact: "Affected events may be unavailable for automatic retry, leaving gaps in activity timelines."
            runbook_url: "https://github.com/milo-os/activity/blob/main/docs/runbooks/dlq/dlq-publish-errors.md"

        # High Retry Count Events
        - alert: ActivityPolicyHighRetryCount
          expr: |
            increase(activity_processor_dlq_retry_events_high_retry_total[1h]) > 10
          for: 1h
          labels:
            severity: warning
            component: activity-processor
            team: sre
          annotations:
            summary: "Activity policy{{ if $labels.policy_name }} {{ $labels.policy_name }}{{ end }} events keep failing retries"
            description: "Activity policy retries{{ if $labels.cluster }} on {{ $labels.cluster }}{{ end }} for {{ $labels.api_group }}/{{ $labels.kind }} recorded {{ $value }} failures at or above the high retry threshold in the last hour. The count can include repeated attempts for the same event. Check the policy and processor logs for persistent evaluation or delivery failures."
            impact: "Affected events remain without activity entries despite repeated retries."
            runbook_url: "https://github.com/milo-os/activity/blob/main/docs/runbooks/dlq/dlq-high-retry-count.md"

        # DLQ slow-leak - low-rate but persistent failures
        - alert: ActivityPolicyFailuresRecurring
          expr: |
            increase(activity_processor_dlq_events_published_total[6h]) > 10
          for: 1h
          labels:
            severity: warning
            component: activity-processor
            team: sre
          annotations:
            summary: "Activity policy{{ if $labels.policy_name }} {{ $labels.policy_name }}{{ end }} has recurring activity generation failures"
            description: "Activity processing{{ if $labels.cluster }} on {{ $labels.cluster }}{{ end }} sent {{ $value }} {{ $labels.event_type }} events for {{ $labels.api_group }}/{{ $labels.kind }} to the dead-letter queue in the last 6 hours with {{ $labels.error_type }} errors. Inspect the activity policy and failed payloads for event shapes its rules do not handle."
            impact: "Some events are not producing activity entries, leaving gaps in activity timelines."
            runbook_url: "https://github.com/milo-os/activity/blob/main/docs/runbooks/dlq/dlq-growth.md"

    # =========================================================================
    # DLQ Retry Effectiveness
    # =========================================================================
    - name: dlq-retry
      interval: 60s
      rules:
        # Repeated policy re-evaluation failures. The attempts counter has no
        # policy_name label, so it cannot provide a per-policy success ratio.
        - alert: ActivityPolicyRetriesFailing
          expr: |
            sum by (cluster, namespace, policy_name, api_group, kind, error_type) (
              increase(activity_processor_dlq_retry_failed_total{policy_name!=""}[1h])
            ) >= 3
          for: 30m
          labels:
            severity: warning
            component: activity-processor
            team: sre
            subject: "{{ $labels.policy_name }}"
          annotations:
            summary: "Activity policy {{ $labels.policy_name }} keeps failing during retries"
            description: "Activity policy {{ $labels.policy_name }} for {{ $labels.api_group }}/{{ $labels.kind }}{{ if $labels.cluster }} on {{ $labels.cluster }}{{ end }} recorded {{ $value | printf \"%.0f\" }} failed re-evaluations in the last hour with {{ $labels.error_type }} errors. The count has remained at three or more for 30 minutes. Affected events are not producing activity entries. Check activity-processor logs for this policy's failing rule and payload. This counts retry attempts, which may include the same event more than once."
            impact: "Activity timelines remain incomplete for affected events because automatic retries are not recovering them."
            runbook_url: "https://github.com/milo-os/activity/blob/main/docs/runbooks/dlq/dlq-retry-failing.md"

    # =========================================================================
    # Per-Policy DLQ Alerts - Policy Owner Responsibility
    # =========================================================================
    - name: dlq-policy-errors
      interval: 60s
      rules:
        # Policy Sending Events to DLQ
        - alert: ActivityPolicyEventProcessingErrors
          expr: |
            sum by (policy_name, api_group, kind, error_type) (
              rate(activity_processor_dlq_events_published_total{policy_name!=""}[10m])
            ) > 0.1
          for: 15m
          labels:
            severity: warning
            component: activity-processor
            team: sre
          annotations:
            summary: "Activity policy {{ $labels.policy_name }} is failing to generate activities"
            description: "Activity policy {{ $labels.policy_name }} for {{ $labels.api_group }}/{{ $labels.kind }} is sending {{ $value }} events/sec to the dead-letter queue with {{ $labels.error_type }} errors. Check the policy's rules against failed event payloads in the activity-processor logs."
            impact: "Affected events are not producing activity entries, leaving gaps in activity timelines."
            runbook_url: "https://github.com/milo-os/activity/blob/main/docs/runbooks/dlq/policy-dlq-errors.md"
