name: Publish UI to NPM

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump-type:
        description: "Version bump type"
        type: choice
        options: [patch, minor, major]
        default: patch

jobs:
  # ── Dev publish ──────────────────────────────────────────────────────────
  # Every push to main publishes a pre-release dev build. Releases are
  # triggered manually via workflow_dispatch when the team is ready to ship.
  publish-dev:
    name: Publish dev build
    if: github.event_name == 'push'
    permissions:
      contents: read
      id-token: write
    uses: datum-cloud/actions/.github/workflows/publish-npm-package.yaml@v1.14.0
    with:
      package-name: "@datum-cloud/activity-ui"
      package-path: ui
      release-mode: dev
    secrets: inherit

  # ── Open release pull request ────────────────────────────────────────────
  # Runs only on manual dispatch. Bumps ui/package.json on a release branch
  # and opens a pull request against main. main only accepts pull requests,
  # so nothing is pushed to main here; merging the pull request is what
  # publishes the release.
  open-release-pr:
    name: Open release pull request
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Bump version
        id: bump
        working-directory: ui
        env:
          BUMP_TYPE: ${{ inputs.bump-type }}
        run: |
          npm version "$BUMP_TYPE" --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "branch=chore/release-activity-ui-v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Push release branch
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          BRANCH: ${{ steps.bump.outputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add ui/package.json
          git commit -m "chore(ui): release @datum-cloud/activity-ui v${VERSION}"
          git push origin "$BRANCH"

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
          BRANCH: ${{ steps.bump.outputs.branch }}
          BUMP_TYPE: ${{ inputs.bump-type }}
        run: |
          BODY="Bumps \`ui/package.json\` to **${VERSION}** (${BUMP_TYPE} bump).

          Merging this pull request publishes \`@datum-cloud/activity-ui\` v${VERSION} to npm's \`latest\` tag and creates the tag \`activity-ui/v${VERSION}\` with a GitHub release."
          gh pr create \
            --repo "${{ github.repository }}" \
            --base main \
            --head "$BRANCH" \
            --title "chore(ui): release @datum-cloud/activity-ui v${VERSION}" \
            --body "$BODY"
