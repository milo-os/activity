    exp_change_source: system
    exp_links: [{marker: view-logs-oncall, apiGroup: "rbac.authorization.k8s.io", kind: ClusterRoleBinding, name: view-logs-oncall}]

  - name: "rbac-clusterrolebindings: create without a name uses the fallback"
    audit: {verb: create, user: {username: "alice@example.com"}, objectRef: {apiGroup: "rbac.authorization.k8s.io", resource: clusterrolebindings}}
    exp_rule: create
    exp_summary: "alice@example.com granted cluster-wide access"

  - name: "rbac-clusterrolebindings: get is not an activity"
    policy: rbac-clusterrolebindings
