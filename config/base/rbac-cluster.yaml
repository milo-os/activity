apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: activity-apiserver
rules:
# Allow reading extension-apiserver-authentication configmap for authentication
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: ["extension-apiserver-authentication"]
  verbs: ["get", "list", "watch"]
# Allow reading flow control resources for API Priority and Fairness
- apiGroups: ["flowcontrol.apiserver.k8s.io"]
  resources: ["flowschemas", "prioritylevelconfigurations"]
  verbs: ["get", "list", "watch"]
# Allow creating subjectaccessreviews for authorization checks
- apiGroups: ["authorization.k8s.io"]
  resources: ["subjectaccessreviews"]
  verbs: ["create"]
# Watch staff-users Group memberships, organization memberships and projects
# (and iam Users, to match uids) to redact Datum staff identities in
# tenant-scoped audit log queries. Until they load, those queries return 503.
- apiGroups: ["iam.miloapis.com"]
  resources: ["groupmemberships", "users"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["resourcemanager.miloapis.com"]
  resources: ["organizationmemberships", "projects"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: activity-apiserver
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: activity-apiserver
subjects:
- kind: ServiceAccount
  name: activity-apiserver
  namespace: activity-system
