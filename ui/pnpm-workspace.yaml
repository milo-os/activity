packages:
  - .
  - example

# Wait a day before installing a newly published version. Most compromised
# releases are pulled within hours. Our own packages are published and
# consumed across repos on the same day, so the delay must not hold them back.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@datum-cloud/*'

# Reject a version published with weaker provenance than the versions before
# it, such as a release pushed with a stolen token for a package that normally
# publishes from CI.
trustPolicy: no-downgrade
# Published without provenance after earlier releases of the same package had
# it. Exempt by exact version, so the next release is checked again.
trustPolicyExclude:
  # Through @react-router/dev, which takes ^4.0.0. 4.0.3 is the last 4.x and
  # every release with provenance after it is a new major.
  - chokidar@4.0.3

# Only scripts a local install needs: esbuild checks its platform binary.
# @tailwindcss/oxide and lightningcss, listed under pnpm 10, ship no install
# script. The image installs with --ignore-scripts.
allowBuilds:
  esbuild: true

overrides:
  '@typescript-eslint/typescript-estree>minimatch': ^11.0.0
  cacache>tar: ^7.5.21
  monaco-editor>dompurify: ^3.4.17
  remark-mdx-frontmatter>toml: ^5.0.1
  '@babel/core@<7.29.6': ^7.29.6
  estree-util-value-to-estree@<3.3.3: ^3.3.3
  morgan@<1.12.1: ^1.12.1
  postcss-selector-parser@<7.1.6: ^7.1.6
  qs@<6.16.0: ^6.16.0
  valibot@<1.4.2: ^1.4.2
  vite@<6.4.4: ^6.4.4
  yaml@<2.8.3: ^2.8.3
  esbuild: ^0.28.0
  # trustPolicy rejects these versions (published without provenance after
  # releases that had it). Move each to the next release in its major that
  # has provenance. recharts 3.8.1 pins reselect 5.1.1; later recharts 3.x
  # pin 5.2.0.
  reselect@5.1.1: 5.2.0
  semver@6: ^6.3.2
