apiVersion: apps/v1
kind: Deployment
metadata:
  name: activity-mcp
  namespace: activity-system
  labels:
    app.kubernetes.io/name: activity-mcp
    app.kubernetes.io/instance: activity-mcp
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/part-of: activity.miloapis.com
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: activity-mcp
      app.kubernetes.io/instance: activity-mcp
      app.kubernetes.io/component: mcp-server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: activity-mcp
        app.kubernetes.io/instance: activity-mcp
        app.kubernetes.io/component: mcp-server
        app.kubernetes.io/part-of: activity.miloapis.com
    spec:
      # Unbound and tokenless; see service_account.yaml.
      serviceAccountName: activity-mcp
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          # Same image as the apiserver, processor and controller-manager;
          # `mcp` selects the subcommand.
          image: ghcr.io/milo-os/activity:latest
          imagePullPolicy: IfNotPresent
          command:
            - /activity
            - mcp
          args:
            - --transport=http
            - --addr=:8080
            # Address and trust only, never a user. Each tool call authenticates
            # with the caller's forwarded bearer token, and the server reaches a
            # project by rewriting the path on this endpoint, so the host must
            # be Milo. Without it the server would aim project paths at an API
            # server that does not serve them.
            - --kubeconfig=/etc/kubernetes/milo/auth/mcp-milo-kubeconfig.yaml
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: milo-kubeconfig
              mountPath: /etc/kubernetes/milo/auth
              readOnly: true
            - name: trust-bundle
              mountPath: /etc/kubernetes/pki/trust
              readOnly: true
      volumes:
        # Supplied by the deployer, not this bundle: which control plane the
        # server reads is deployment topology. The kubeconfig should name
        # certificate-authority: /etc/kubernetes/pki/trust/ca.crt.
        - name: milo-kubeconfig
          configMap:
            name: activity-mcp-milo-kubeconfig
        # The control plane CA, the same ConfigMap the UI component mounts.
        # trust-manager injects it into namespaces carrying
        # infra.datum.net/inject-datum-control-plane-trust-bundle.
        - name: trust-bundle
          configMap:
            name: datum-control-plane-trust-bundle
      # No writable volume: the docs and runbooks it serves are compiled in,
      # and nothing writes to disk.
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
