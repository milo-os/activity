apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
data:
  # Written as $$VAR: Flux postBuild envsubst collapses $$ to a literal $,
  # leaving nats-server's own env interpolation to resolve it at startup.
  nats.conf: |
    server_name: edge-nats
    listen: 0.0.0.0:4222
    tls {
      cert_file: "/etc/nats-server-tls/tls.crt"
      key_file: "/etc/nats-server-tls/tls.key"
      ca_file: "/etc/nats-server-tls/ca.crt"
      verify: true
    }
    http_port: 8222
    leafnodes {
      remotes: [
        {
          url: $$HUB_LEAFNODE_URL
          # The hub's leafnode listener serves a publicly-trusted cert and
          # requests no client cert -- identity comes from the NKey
          # signature, not a certificate chain, so no cross-cluster trust
          # bundle is needed to reach a hub in a different cluster.
          nkey: $$EDGE_NKEY_SEED
          tls: {
            handshake_first: true
          }
        }
      ]
    }
