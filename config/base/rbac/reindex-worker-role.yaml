apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: activity-reindex-worker
rules:
# Read ReindexJob spec
- apiGroups: ["activity.miloapis.com"]
  resources: ["reindexjobs"]
  verbs: ["get"]

# Update ReindexJob status
- apiGroups: ["activity.miloapis.com"]
  resources: ["reindexjobs/status"]
  verbs: ["update", "patch"]

# List ActivityPolicy resources
- apiGroups: ["activity.miloapis.com"]
  resources: ["activitypolicies"]
  verbs: ["get", "list"]

# Query audit logs and events via API, and existing activities (to keep
# activities already recorded as staff access redacted)
- apiGroups: ["activity.miloapis.com"]
  resources: ["auditlogqueries", "eventqueries", "activityqueries"]
  verbs: ["create"]

# Watch Milo iam Users to enrich re-indexed activities with actor display
# names and avatars. Optional: without it activities are re-indexed unenriched.
- apiGroups: ["iam.miloapis.com"]
  resources: ["users"]
  verbs: ["get", "list", "watch"]

# Watch staff-users Group memberships, organization memberships and projects
# so re-indexed activities show Datum staff as "Datum Support", like the
# processor does.
- apiGroups: ["iam.miloapis.com"]
  resources: ["groupmemberships"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["resourcemanager.miloapis.com"]
  resources: ["organizationmemberships", "projects"]
  verbs: ["get", "list", "watch"]
