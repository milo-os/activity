name: Build and Publish Docker Image

on:
  push:
  release:
    types: ["published"]

jobs:
  validate-kustomize:
    uses: datum-cloud/actions/.github/workflows/validate-kustomize.yaml@v1.12.1

  publish-container-image:
    # No point in trying to build the container image if the deployment
    # manifests are invalid.
    # activity-ui releases (tags activity-ui/v*) ship an npm package, not a
    # new API server, so skip the image build for them.
    if: ${{ !(github.event_name == 'release' && startsWith(github.event.release.tag_name, 'activity-ui/')) }}
    needs:
      - validate-kustomize
    permissions:
      id-token: write
      contents: read
      packages: write
      attestations: write
    uses: datum-cloud/actions/.github/workflows/publish-docker.yaml@v1.14.0
    with:
      image-name: activity
      registry-organization: milo-os
    secrets: inherit

  publish-ui-container-image:
    # Build and publish the Activity UI container image
    needs:
      - validate-kustomize
    permissions:
      id-token: write
      contents: read
      packages: write
      attestations: write
    uses: datum-cloud/actions/.github/workflows/publish-docker.yaml@v1.14.0
    with:
      image-name: activity-ui
      context: ui
      dockerfile-path: ui/Dockerfile
      registry-organization: milo-os
    secrets: inherit

  publish-kustomize-bundles:
    # Ensure the kustomize manifests are valid and the container is published
    # before we publish the kustomize manifests. We expect publishing the
    # kustomize manifests to result in new deployments going out.
    # activity-ui releases (tags activity-ui/v*) ship an npm package, not a
    # new API server, so skip the bundle publish for them.
    if: ${{ !(github.event_name == 'release' && startsWith(github.event.release.tag_name, 'activity-ui/')) }}
    needs:
      - validate-kustomize
      - publish-container-image
    permissions:
      id-token: write
      contents: read
      packages: write
    uses: datum-cloud/actions/.github/workflows/publish-kustomize-bundle.yaml@v1.14.0
    with:
      bundle-name: ghcr.io/milo-os/activity-kustomize
      bundle-path: config
      image-overlays: config/base
      image-name: ghcr.io/milo-os/activity
    secrets: inherit

  publish-ui-kustomize-bundle:
    # Publish the UI kustomize bundle separately
    needs:
      - validate-kustomize
      - publish-ui-container-image
    permissions:
      id-token: write
      contents: read
      packages: write
    uses: datum-cloud/actions/.github/workflows/publish-kustomize-bundle.yaml@v1.14.0
    with:
      bundle-name: ghcr.io/milo-os/activity-ui-kustomize
      bundle-path: config/components/ui
      image-overlays: config/components/ui
      image-name: ghcr.io/milo-os/activity-ui
    secrets: inherit
