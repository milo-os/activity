# Dev stand-in for the Milo kubeconfig activity-mcp expects. There is no Milo
# in the dev cluster, so this names the kind API server instead: the pod
# starts and serves /healthz, /llms-full.txt and /runbooks/<name>.md, but tool
# calls fail, because the server addresses a project by appending Milo's
# project control-plane path, which kind does not serve. To exercise tools,
# run `activity mcp --transport=http` against a real Milo instead.
#
# Address and trust only, never a user: each call uses the caller's token.
apiVersion: v1
kind: ConfigMap
metadata:
  name: activity-mcp-milo-kubeconfig
  namespace: activity-system
data:
  mcp-milo-kubeconfig.yaml: |
    apiVersion: v1
    kind: Config
    clusters:
    - name: milo
      cluster:
        certificate-authority: /etc/kubernetes/pki/trust/ca.crt
        server: https://kubernetes.default.svc
    contexts:
    - name: default
      context:
        cluster: milo
        user: caller
    current-context: default
    users:
    - name: caller
      user: {}
