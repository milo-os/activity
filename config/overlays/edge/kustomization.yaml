apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: activity-system

# An edge cell only collects and relays: it runs no apiserver, processor,
# ClickHouse, etcd or UI -- those live in the hub cluster.
components:
  - ../../components/k8s-event-exporter   # Kubernetes events → edge NATS relay
  - ../../components/nats-edge-relay      # Leafnode relay to the hub NATS

# Edge-local copy of the exporter's ServiceMonitor: the observability
# component holds the shared one, but also monitors hub-only workloads.
resources:
  - k8s-event-exporter-servicemonitor.yaml

patches:
  - path: patches/k8s-event-exporter-patch.yaml
