apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: activity-alerts
  namespace: activity-system
  labels:
    prometheus: activity
    app.kubernetes.io/part-of: activity
    monitoring: "true"
spec:
  groups:
    # =========================================================================
    # Key SLI Alerts - User-Facing Service Quality
    # =========================================================================
    - name: activity-sli
      interval: 30s
      rules:
        # Service Availability SLI
        - alert: ActivityAPIServerDown
          expr: up{job="activity-apiserver"} == 0
          for: 5m
          labels:
            severity: critical
            component: activity-apiserver
            sli: availability
          annotations:
            summary: "Activity is unavailable"
            description: "Activity has been down for more than 5 minutes. Users cannot query audit logs."
            impact: "Complete service outage - no audit log queries possible"

        # Request Success Rate SLI (Error Budget)
        - alert: ActivityHighErrorRate
          expr: |
            sum(rate(apiserver_request_total{job="activity-apiserver",code=~"5.."}[5m]))
            /
            sum(rate(apiserver_request_total{job="activity-apiserver"}[5m]))
            > 0.01
          for: 10m
          labels:
            severity: warning
            component: activity-apiserver
            sli: success_rate
          annotations:
            summary: "High error rate in Activity"
            description: "{{ $value | humanizePercentage }} of requests are failing (target: <1%)"
            impact: "Users experiencing failed audit log queries"

        # Query Latency SLI - Most Critical for User Experience
        # Threshold lowered to 5s: investigation found real user impact at 4s p99 which the
        # previous 10s threshold would never have caught.
        - alert: ActivityQueryLatencyHigh
          expr: |
            histogram_quantile(0.99,
              sum(rate(activity_clickhouse_query_duration_seconds_bucket{operation="total"}[5m]))
              by (le)
            ) > 5
          for: 10m
          labels:
            severity: warning
            component: activity-apiserver
            sli: latency
          annotations:
            summary: "Audit log queries are slow"
            description: "p99 query latency is {{ $value }}s (target: <5s). Users experiencing slow responses."
            impact: "Degraded user experience - queries taking too long"

        # Data Availability SLI - Backend Health
        - alert: ActivityClickHouseUnavailable
          expr: |
            rate(activity_clickhouse_query_errors_total{error_type="connection"}[5m]) > 0.1
          for: 5m
          labels:
            severity: critical
            component: clickhouse
            sli: availability
          annotations:
            summary: "ClickHouse database is unavailable"
            description: "Cannot connect to ClickHouse ({{ $value }} errors/sec). Audit log data is inaccessible."
            impact: "Complete service degradation - no data can be retrieved"

        # AuditLogQuery 504 timeout errors
        - alert: AuditLogQuery504Errors
          expr: |
            rate(apiserver_request_total{job="activity-apiserver",code="504",resource="auditlogqueries"}[5m]) > 0.01
          for: 5m
          labels:
            severity: warning
            component: activity-apiserver
            sli: availability
          annotations:
            summary: "Audit log queries returning timeout errors"
            description: "{{ $value }} 504 errors/sec on auditlogqueries. Queries are timing out."
            impact: "Users experiencing failed audit log queries"

        # ClickHouse query row iteration errors
        - alert: ClickHouseQueryIterationErrors
          expr: |
            rate(activity_clickhouse_query_errors_total{error_type="iteration"}[5m]) > 0.5
          for: 5m
          labels:
            severity: warning
            component: activity-apiserver
            sli: availability
          annotations:
            summary: "ClickHouse query row iteration errors"
            description: "{{ $value }} iteration errors/sec. May indicate client disconnects or ClickHouse issues."
            impact: "Some queries failing during result streaming"

    # =========================================================================
    # Data Pipeline Health - Ensures Fresh Data
    # =========================================================================
    - name: activity-pipeline
      interval: 30s
      rules:
        # Data Freshness SLI - Critical for audit compliance
        # Uses component_type="clickhouse" to match all three ClickHouse sinks rather than
        # component_id="clickhouse" which does not match any Vector component name.
        - alert: ActivityDataPipelineStalled
          expr: |
            sum(rate(vector_component_sent_events_total{component_type="clickhouse",namespace="activity-system"}[5m])) == 0
          for: 15m
          labels:
            severity: critical
            component: vector-aggregator
            sli: data_freshness
          annotations:
            summary: "Audit event pipeline has stalled"
            description: "No new audit events are being stored in ClickHouse across any sink. Data is becoming stale."
            impact: "Users querying outdated audit data - compliance risk"

        # NATS Consumer Lag - Early warning before backlog becomes critical
        - alert: NATSConsumerLagHigh
          expr: |
            max by (consumer_name) (nats_consumer_num_pending{stream_name="AUDIT_EVENTS",consumer_name=~"clickhouse-ingest.*"}) > 5000
          for: 5m
          labels:
            severity: warning
            component: nats
            sli: data_freshness
          annotations:
            summary: "Audit event consumer backlog growing"
            description: "{{ $value }} messages pending in AUDIT_EVENTS stream. Events not reaching ClickHouse."
            impact: "Audit log queries may return incomplete results"

        # NATS Consumer Lag - Leading indicator of pipeline issues.
        # 50k is ~8 minutes of a fully stopped consumer at this stream's ~100
        # events/s. The previous 500k was ~83 minutes, set against a metric that
        # never existed and so never calibrated against real throughput. Sits a
        # decade above the observed 30-day maximum of 2 pending, and one order
        # above the 5k warning.
        - alert: ActivityPipelineBacklogCritical
          expr: |
            max by (consumer_name) (nats_consumer_num_pending{stream_name="AUDIT_EVENTS"}) > 50000
          for: 10m
          labels:
            severity: critical
            component: nats
            sli: data_freshness
          annotations:
            summary: "Audit event backlog is critical"
            description: "{{ $value }} audit events pending. Risk of data loss if retention exceeded."
            impact: "Large delay in audit event availability - potential data loss"

        # Vector write pipeline stopped while still receiving from NATS.
        # Evaluated per pod so a single stalled aggregator replica is caught while
        # its siblings keep the aggregate non-zero.
        - alert: VectorClickHouseWritesStopped
          expr: |
            sum by (pod) (rate(vector_component_sent_events_total{component_type="clickhouse",namespace="activity-system"}[15m])) == 0
            AND
            sum by (pod) (rate(vector_component_received_events_total{component_type="nats",namespace="activity-system"}[15m])) > 0
          for: 15m
          labels:
            severity: warning
            component: vector-aggregator
            sli: data_freshness
          annotations:
            summary: "Vector receiving events but not writing to ClickHouse"
            description: "{{ $labels.pod }} is receiving from NATS but its ClickHouse sinks have zero output for 15+ minutes."
            impact: "Audit events not being stored — queries returning stale data"

        # Event Exporter Availability
        - alert: EventExporterDown
          expr: up{job="k8s-event-exporter"} == 0
          for: 5m
          labels:
            severity: warning
            component: k8s-event-exporter
          annotations:
            summary: "Kubernetes event exporter is unavailable"
            description: "Event exporter has been down for more than 5 minutes. Kubernetes events are not being published to NATS."
            impact: "Cluster events not being captured - event timeline will have gaps"

        # Event Exporter Publish Errors
        - alert: EventExporterPublishErrors
          expr: rate(event_exporter_publish_errors_total{job="k8s-event-exporter"}[5m]) > 0.1
          for: 10m
          labels:
            severity: warning
            component: k8s-event-exporter
          annotations:
            summary: "Event exporter experiencing publish errors"
            description: "{{ $value }} publish errors/sec for 10+ minutes. Events may not reach NATS."
            impact: "Some cluster events missing from timeline"

    # =========================================================================
    # Activity Processor Health - Translation Engine
    # =========================================================================
    - name: activity-processor
      interval: 30s
      rules:
        # Processor Availability
        - alert: ActivityProcessorDown
          expr: up{job="activity-processor"} == 0
          for: 5m
          labels:
            severity: critical
            component: activity-processor
          annotations:
            summary: "Activity processor is unavailable"
            description: "Activity processor has been down for more than 5 minutes. No new activities are being generated."
            impact: "Complete activity generation outage - audit events not translated to activities"

        # NATS Connection Health
        - alert: ActivityProcessorNATSDisconnected
          expr: activity_processor_nats_connection_status == 0
          for: 2m
          labels:
            severity: critical
            component: activity-processor
          annotations:
            summary: "Activity processor disconnected from NATS"
            description: "Processor has lost NATS connection. Cannot receive events."
            impact: "Activity generation stopped - events not being processed"

        # Activity Generation Stalled
        # Measured on events evaluated, not activities generated: generation is
        # policy-driven and legitimately zero for hours at a time, whereas every
        # received audit event is evaluated. Both sides are aggregated so their
        # label sets match — the metrics carry different labels (kind/policy vs
        # resource/source) and would never join otherwise.
        - alert: ActivityGenerationStalled
          expr: |
            sum(rate(activity_processor_events_evaluated_total[15m])) == 0
            AND
            sum(rate(activity_processor_events_received_total{source="audit_log"}[15m])) > 0
          for: 15m
          labels:
            severity: warning
            component: activity-processor
          annotations:
            summary: "Activity generation has stalled"
            description: "Processor receiving audit events but evaluating none against policies for 15m+. CEL evaluation or policy lookup may be broken."
            impact: "Activity timeline not updating - users see stale data"

        # Error Rate Threshold
        - alert: ActivityProcessorHighErrorRate
          expr: |
            sum(rate(activity_processor_events_errored_total{source="audit_log"}[5m]))
            /
            sum(rate(activity_processor_events_received_total{source="audit_log"}[5m]))
            > 0.05
          for: 10m
          labels:
            severity: warning
            component: activity-processor
          annotations:
            summary: "High error rate in activity processor"
            description: "{{ $value | humanizePercentage }} of events failing to process (target: <5%)"
            impact: "Some activities missing from timeline - potential data gaps"

        # Policy Cache Health
        - alert: ActivityProcessorNoPolicies
          expr: activity_processor_active_policies == 0
          for: 15m
          labels:
            severity: warning
            component: activity-processor
          annotations:
            summary: "Activity processor has no active policies"
            description: "Policy cache is empty. Events will not be translated to activities."
            impact: "No activities being generated - timeline will be empty"

    # =========================================================================
    # Activity Controller Manager - Policy Lifecycle
    # =========================================================================
    - name: activity-controller
      interval: 30s
      rules:
        # Policy Validation Failures
        - alert: ActivityPolicyValidationFailing
          expr: sum(rate(activity_controller_policy_validation_errors_total[10m])) > 0.1
          for: 15m
          labels:
            severity: warning
            component: activity-controller-manager
          annotations:
            summary: "ActivityPolicy validation failures occurring"
            description: "{{ $value }} policy validation errors/sec. Policies may be misconfigured."
            impact: "Some policies may not be active - activity generation could be incomplete"

        # Policy Readiness
        - alert: ActivityPolicyNotReady
          expr: count by (policy) (activity_controller_policy_ready == 0) > 0
          for: 30m
          labels:
            severity: warning
            component: activity-controller-manager
          annotations:
            summary: "ActivityPolicies not ready"
            description: "{{ $value }} ActivityPolicy resources not ready for 30+ minutes."
            impact: "Affected policies not being used by processor - activity generation incomplete"

    # =========================================================================
    # ClickHouse Storage Health - Keeper/ZooKeeper Session Integrity
    # =========================================================================
    - name: clickhouse-health
      interval: 30s
      rules:
        # ClickHouse ZooKeeper/Keeper session health
        # Discovered during incident investigation: a keeper outage produced a 7-hour
        # KEEPER_EXCEPTION storm with no alert firing. Session expirations affect
        # deduplication and replication correctness.
        - alert: ClickHouseKeeperSessionErrors
          expr: |
            sum(rate(chi_clickhouse_event_ZooKeeperSessionExpired[10m])) > 0.1
          for: 10m
          labels:
            severity: warning
            component: clickhouse
            sli: availability
          annotations:
            summary: "ClickHouse ZooKeeper sessions expiring"
            description: "{{ $value }} ZooKeeper session expirations/sec. Keeper cluster may be degraded."
            impact: "Potential data consistency risk - deduplication and replication may be affected"
